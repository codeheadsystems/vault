[package]
name = "vault-core"
version = "0.1.0"
description = "vault crypto, file format, item model, merge, and sync decisions; no I/O"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Accept the test KDF parameter set (`test_kdf` headers). Debug builds only: a build without
# `debug_assertions` fails to compile with it. Never enable it through a dev-dependency, because
# feature unification would leak it into `cargo test --workspace` and break
# `tests/release_gate.rs`.
insecure-test-kdf = []

[dependencies]
argon2.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true
zeroize.workspace = true
unicode-normalization.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
hex.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
