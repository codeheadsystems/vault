[package]
name = "vault-server"
version = "0.1.0"
description = "vault serve: the blob server, its data directory, and its commands"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vault-core = { path = "../vault-core" }
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "signal", "macros", "fs", "io-util"] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio", "server", "http1"] }
http-body.workspace = true
http-body-util.workspace = true
bytes.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
qrcode.workspace = true
rustix.workspace = true
toml.workspace = true
getrandom.workspace = true
subtle.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
url.workspace = true
hex.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }

[lints]
workspace = true
