# Versions of every plugin and library the Android app uses. Gradle dependency verification
# (verification-metadata.xml) pins the checksum of each artefact these resolve to.

[versions]
agp = "9.4.1"
# The Kotlin version AGP 9.4.1 bundles; the Compose compiler plugin must match it.
kotlin = "2.2.10"
compose-bom = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.11.0"
camera = "1.6.2"
zxing = "3.5.4"
jna = "5.19.1"
junit = "4.13.2"
json = "20260814"
coroutines = "1.10.2"
androidx-test = "1.7.0"
androidx-test-junit = "1.3.0"
uiautomator = "2.3.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camera" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
junit = { module = "junit:junit", version.ref = "junit" }
# org.json for the JVM tests, which read the spec vectors; Android provides it at runtime.
json = { module = "org.json:json", version.ref = "json" }
test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
test-rules = { module = "androidx.test:rules", version.ref = "androidx-test" }
test-core = { module = "androidx.test:core", version.ref = "androidx-test" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
