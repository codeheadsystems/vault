[workspace]
members = [
    "crates/vault-core",
    "crates/vault-client",
    "crates/vault-interop",
    "crates/vault-server",
    "crates/vault-cli",
    "crates/vault-wasm",
    "crates/vault-android",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.96"
publish = false

[workspace.dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
hkdf = "0.13"
sha2 = { version = "0.11", default-features = false }
zeroize = { version = "1", features = ["derive"] }
unicode-normalization = "0.1.25"
serde = "1"
serde_json = "1"
url = "2"
hex = "0.4"
proptest = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", default-features = false }
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
http-body = "1"
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
qrcode = { version = "0.14", default-features = false }
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }
toml = "1"
getrandom = "0.2"
subtle = "2"
tempfile = "3"
aes = { version = "0.9", default-features = false, features = ["zeroize"] }
cbc = { version = "0.2", default-features = false, features = ["block-padding", "zeroize"] }
hmac = { version = "0.13", default-features = false }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
base64ct = { version = "1.8", default-features = false, features = ["alloc"] }
signal-hook = "0.4"
secret-service = { version = "5.2", default-features = false, features = ["rt-async-io-crypto-rust"] }
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
nix = { version = "0.29", default-features = false, features = ["fs"] }
memmap2 = "0.9"
clap_complete = "4"
webpki-roots = "1"
# Pinned exactly: wasm-bindgen-cli must be the same version.
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
wasm-bindgen-test = "0.3"
# Pinned exactly: the generated Kotlin must match the scaffolding of the same version.
uniffi = "=0.32.2"
idna = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3

[profile.release]
overflow-checks = true

# The Firefox extension's WASM module: `cargo build -p vault-wasm --target wasm32-unknown-unknown
# --profile wasm`.
[profile.wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3

# The Android app's native library: `cargo ndk -t arm64-v8a -t x86_64 -P 29 build -p vault-android
# --profile android`.
[profile.android]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
