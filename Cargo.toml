[workspace]
members = ["crates/vault-core"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.96"
publish = false

[workspace.dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
hkdf = "0.13"
sha2 = { version = "0.11", default-features = false }
zeroize = { version = "1", features = ["derive"] }
unicode-normalization = "0.1.25"
serde = "1"
serde_json = "1"
url = "2"
hex = "0.4"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3

[profile.release]
overflow-checks = true
