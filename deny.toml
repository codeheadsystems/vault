# Licence and supply-chain policy. docs/requirements.md lists the allowed licences.

[graph]
all-features = true
# The platforms vault builds for; Windows-only dependencies are out of scope.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-freebsd",
    "wasm32-unknown-unknown",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.93

# The Mozilla root set the CLI trusts for a publicly trusted certificate (requirements: Licence).
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# rustls uses the ring provider; aws-lc carries the OpenSSL licence.
deny = [
    { crate = "aws-lc-sys" },
    { crate = "aws-lc-rs" },
    { crate = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
